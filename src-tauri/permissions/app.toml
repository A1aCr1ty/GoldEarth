# 应用自己的命令权限。
#
# 一旦 build.rs 里配了 app_manifest，App 就有了 ACL 清单，
# 而 Tauri 的规则是「有清单就一律走 ACL」（tauri/src/webview/mod.rs:2080），
# 所以每个命令都必须在这里显式声明 —— 少写一个，界面上就是
# 「xxx not allowed. Command not found」。
#
# 名单由 src/lib.rs 的 generate_handler! 生成，别手改；
# 加了新命令记得两边都补。

[[permission]]
identifier = "allow-app-commands"
description = "App 自己的全部命令，供主窗口使用。"
commands.allow = [
  "file_search_status",
  "file_search_index",
  "file_search_query",
  "file_search_reveal",
  "archify_template",
  "prepare_archify_generation",
  "render_archify",
  "export_archify",
  "export_archify_to_category",
  "open_archify_category_folder",
  "add_price_target",

[package]
name = "gold-earth"
version = "0.1.0"
description = "GoldEarth - local personal affairs manager"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gold_earth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
# 行情数据抓取走 Rust 侧，绕开 WebView 的跨域限制；用 rustls 免装 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
dom_query = "0.28"

[dev-dependencies]
# 抓价窗能不能调到 xianyu_report，全押在 capabilities/xianyu.json 的
# remote.urls 上，而匹配逻辑（ipc/authority.rs 的 Origin::matches → UrlPattern::test）
# 藏在 Tauri 里看不见。这里把它拉进来，在单测里直接验我们写的 pattern
# 到底匹配不匹配真实的闲鱼地址，不靠推理。
tauri-utils = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
